name: dRilL Build

env:
  main_project_module: app

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: dRilL Identity (all languages + UI + links)
        run: |
          sed -i 's/YTDLnis/dRilL/g' app/src/main/res/values*/strings.xml
          grep -rl "YTDLnis" app/src/main/res --include="*.xml" 2>/dev/null | xargs -r sed -i 's/YTDLnis/dRilL/g'
          grep -rl "t.me/ytdlnis\|discord.gg\|deniscerri/ytdlnis" app/src/main --include="*.kt" --include="*.java" --include="*.xml" 2>/dev/null | xargs -r sed -i 's|https://t.me/ytdlnis|https://github.com/3mkdRilL/dRilL|g; s|https://discord.gg/[A-Za-z0-9]*|https://github.com/3mkdRilL/dRilL|g; s|github.com/deniscerri/ytdlnis|github.com/3mkdRilL/dRilL|g'
          echo "✅ dRilL identity complete"

      - name: Build dRilL APK (release, arm64)
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Upload dRilL APK
        uses: actions/upload-artifact@v4
        with:
          name: drill-apk
          path: ${{ env.main_project_module }}/build/outputs/apk/github/release/*arm64-v8a*.apk
