name: dRilL Build

env:
  main_project_module: app

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: dRilL Identity (all languages)
        run: |
          sed -i 's/YTDLnis/dRilL/g' app/src/main/res/values*/strings.xml
          grep -rl "deniscerri/ytdlnis" app/src/main/java app/src/main/res 2>/dev/null | xargs -r sed -i 's|github.com/deniscerri/ytdlnis|github.com/3mkdRilL/dRilL|g'
          echo "✅ dRilL identity applied to all languages"

      - name: Build dRilL APK (release, arm64)
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Upload dRilL APK
        uses: actions/upload-artifact@v4
        with:
          name: drill-apk
          path: ${{ env.main_project_module }}/build/outputs/apk/github/release/*arm64-v8a*.apk
