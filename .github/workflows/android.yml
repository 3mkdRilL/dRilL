name: dRilL Build

env:
  main_project_module: app

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build dRilL APK (github flavor, debug)
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleGithubDebug

      - name: Upload dRilL APKs
        uses: actions/upload-artifact@v4
        with:
          name: drill-apk
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/*.apk
