name: Rebrand
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dRilL Identity
        run: |
          cd app/src/main/res/values
          sed -i 's/YTDLnis/dRilL/g; s|github.com/deniscerri/ytdlnis|github.com/3mkdRilL/dRilL|g' strings.xml
          git config user.name "3mkdRilL"
          git config user.email "3mkdRilL@users.noreply.github.com"
          git add strings.xml
          if ! git diff --cached --quiet; then
            git commit -m "identity: dRilL rebrand"
            git push
            echo "✅ dRilL ظهر في $(grep -o dRilL strings.xml | wc -l) مكان"
          else
            echo "مفيش تغييرات"
          fi
